<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Kulatý stůl shora: šest lidí, jedno místo volné">
  <!-- The logo's idea, bigger: a round table from above with cups and plates, five people and a free seat. -->
  <circle cx="200" cy="200" r="190" fill="#9a4521"/>
  <circle cx="200" cy="200" r="92" fill="#fff8f6"/>
  <circle cx="200" cy="200" r="92" fill="none" stroke="#e9cbbd" stroke-width="3"/>
  <!-- on the table -->
  <g fill="#fff" stroke="#e2c2b3" stroke-width="2">
    <circle cx="200" cy="140" r="16"/>
    <circle cx="252" cy="172" r="14"/>
    <circle cx="252" cy="230" r="16"/>
    <circle cx="148" cy="230" r="14"/>
    <circle cx="148" cy="172" r="16"/>
  </g>
  <circle cx="200" cy="140" r="8" fill="#7b4a33"/>
  <circle cx="252" cy="230" r="8" fill="#f2c14e"/>
  <circle cx="148" cy="172" r="8" fill="#7b4a33"/>
  <circle cx="252" cy="172" r="6" fill="#d7ead9"/>
  <circle cx="148" cy="230" r="6" fill="#f6d3c6"/>
  <ellipse cx="200" cy="205" rx="22" ry="14" fill="#f2c14e" opacity="0.9"/>
  <!-- people (heads from above) -->
  <circle cx="200" cy="62" r="30" fill="#ffd166"/>
  <circle cx="320" cy="270" r="30" fill="#8fd3b6"/>
  <circle cx="200" cy="338" r="30" fill="#ffb59b"/>
  <circle cx="80" cy="270" r="30" fill="#a9c7ff"/>
  <circle cx="80" cy="130" r="30" fill="#f4a6c6"/>
  <!-- the free seat -->
  <circle cx="320" cy="130" r="25" fill="none" stroke="#fff8f6" stroke-width="7" stroke-dasharray="10 8"/>
  <text x="320" y="139" text-anchor="middle" font-family="Nunito, system-ui, sans-serif" font-weight="800" font-size="26" fill="#fff8f6">+</text>
</svg>
