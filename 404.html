<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meetka</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121010" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script>
    // Serves https://meetka.eu/t/<id>: with the app installed, Android opens the app directly
    // (App Links); otherwise this page offers to open it or to get it. Anything else is a 404.
    window.MEETKA_TEXTS = {
      cs: {
        title: "Pozvánka na aktivitu · Meetka",
        inviteTitle: "Pozvánka na aktivitu",
        inviteLead: "Někdo tě zve na aktivitu na Meetce. Otevři ji v aplikaci: uvidíš, kde a kdy se sejdete a kolik vás bude.",
        open: "Otevřít v aplikaci Android",
        openWeb: "Otevřít v prohlížeči",
        noApp: "Na iPhonu a bez aplikace funguje Meetka v prohlížeči. Android appka bude brzy na Google Play.",
        home: "Co je Meetka?",
        notFoundTitle: "Tahle stránka tu není",
        notFoundLead: "Odkaz je možná neúplný.",
        themeLabel: "Přepnout světlý / tmavý vzhled"
      },
      en: {
        title: "Activity invitation · Meetka",
        inviteTitle: "You are invited",
        inviteLead: "Someone invites you to an activity on Meetka. Open it in the app to see where and when you meet and how many are going.",
        open: "Open in the Android app",
        openWeb: "Open in the browser",
        noApp: "On iPhone or without the app, Meetka works in the browser. The Android app is coming to Google Play soon.",
        home: "What is Meetka?",
        notFoundTitle: "This page is not here",
        notFoundLead: "The link may be incomplete.",
        themeLabel: "Switch light / dark appearance"
      }
    };
  </script>
  <script src="/site.js"></script>
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="/"><img src="/favicon.svg" alt="">Meetka</a>
    <span class="spacer"></span>
    <div class="seg" role="group" aria-label="Jazyk / Language">
      <button data-lang="cs" onclick="meetkaLang('cs')">CZ</button>
      <button data-lang="en" onclick="meetkaLang('en')">EN</button>
    </div>
    <button class="theme" data-theme-toggle aria-pressed="false" onclick="meetkaTheme()" data-i18n-label="themeLabel" aria-label="Přepnout světlý / tmavý vzhled">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
    </button>
  </div>
</header>

<main class="page">
  <section id="invite" hidden>
    <h1 data-i18n="inviteTitle">Pozvánka na aktivitu</h1>
    <p class="lead" data-i18n="inviteLead"></p>
    <div class="actions"><a id="web" class="btn" href="/app/" data-i18n="openWeb">Otevřít v prohlížeči</a>
      <a id="open" class="btn outline" href="#" data-i18n="open">Otevřít v aplikaci Android</a></div>
    <p class="note" data-i18n="noApp"></p>
    <p class="back"><a href="/" data-i18n="home">Co je Meetka?</a></p>
  </section>
  <section id="missing" hidden>
    <h1 data-i18n="notFoundTitle">Tahle stránka tu není</h1>
    <p class="lead" data-i18n="notFoundLead"></p>
    <div class="actions"><a class="btn" href="/" data-i18n="home">Co je Meetka?</a></div>
  </section>
</main>

<script>
  (function () {
    // A deep link into the web app (e.g. a reload on /app/diary): GitHub Pages has no SPA fallback,
    // so hand the path to the app, which restores it (pwa/index.html).
    if (location.pathname.indexOf("/app/") === 0) {
      location.replace("/app/?p=" + encodeURIComponent(location.pathname.slice(4) + location.search));
      return;
    }
    var match = location.pathname.match(/^\/t\/([A-Za-z0-9_-]+)\/?$/);
    if (match) {
      document.getElementById("open").href = "meetka://table/" + match[1] + location.search;
      document.getElementById("web").href = "/app/a/" + match[1];
      document.getElementById("invite").hidden = false;
    } else {
      document.getElementById("missing").hidden = false;
    }
  })();
</script>
</body>
</html>
