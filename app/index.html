    <script>
      // The theme before the first paint, so a dark choice never flashes white (lib/theme.ts).
      ;(function () {
        try {
          var t = localStorage.getItem('meetka-theme')
          var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          // The chosen colour palette (lib/palette.ts), saved as ready CSS.
          var p = JSON.parse(localStorage.getItem('meetka-palette') || 'null')
          if (p && p.css) {
            var s = document.createElement('style')
            s.id = 'meetka-palette'
            s.textContent = p.css
            document.head.appendChild(s)
            document.documentElement.dataset.palette = p.seed
          }
        } catch (e) {}
      })()
      // meetka.eu/404.html sends deep links here as ?p=/diary (GitHub Pages has no SPA fallback).
      ;(function () {
        var p = new URLSearchParams(location.search).get('p')
        if (p && p.charAt(0) === '/') history.replaceState(null, '', '/app' + p)
      })()
    </script>
